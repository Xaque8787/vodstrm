services:
  vodstrm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vodstrm
    restart: unless-stopped
    ports:
      - "${APP_PORT:-2112}:${APP_PORT:-2112}"
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-2112}
      APP_RELOAD: ${APP_RELOAD:-true}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REMEMBER_ME_DAYS: ${REMEMBER_ME_DAYS:-30}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DATABASE_PATH: ${DATABASE_PATH:-data/app.db}
      SCHEDULER_DB_PATH: ${SCHEDULER_DB_PATH:-data/scheduler.db}
      DATA_PATH: ${DATA_PATH:-./data}
      M3U_DIR: ${M3U_DIR:-data/m3u}
      LOG_DIR: ${LOG_DIR:-data/logs}
      VOD_PATH: ${VOD_PATH:-data/vod}
      VOD_OFFLINE_PATH: ${VOD_OFFLINE_PATH:-data/vod-offline}
      VOD_MOVIES_FOLDER: ${VOD_MOVIES_FOLDER:-movies}
      VOD_SERIES_FOLDER: ${VOD_SERIES_FOLDER:-series}
      VOD_LIVE_TV_FOLDER: ${VOD_LIVE_TV_FOLDER:-livetv}
      VOD_UNSORTED_FOLDER: ${VOD_UNSORTED_FOLDER:-unsorted}
      VOD_UNKNOWN_YEAR_FOLDER: ${VOD_UNKNOWN_YEAR_FOLDER:-unknown}
      TZ: ${TZ:-America/Los_Angeles}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      # Uncomment and point to a host path containing local .m3u files. Or place m3u files directly in /app/data/m3u.
      # - /path/on/host/to/m3u:/app/data/m3u
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-2112}/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
